<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

<!-- fundo -->
<circle cx="100" cy="100" r="90" fill="#081725" stroke="#0a4e86" stroke-width="3"></circle>

<!-- servidor maior -->
<rect x="55" y="65" width="90" height="85" rx="10" fill="#2c3137" stroke="#11161b" stroke-width="2"></rect>

<!-- linhas do rack -->
<g stroke="#cfd6dd" stroke-width="2">
<line x1="70" y1="85" x2="130" y2="85"></line>
<line x1="70" y1="105" x2="130" y2="105"></line>
<line x1="70" y1="125" x2="130" y2="125"></line>
</g>

<!-- leds -->
<circle cx="72" cy="140" r="4" fill="#00ff7a">
<animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"></animate>
</circle>

<circle cx="128" cy="140" r="4" fill="#00ff7a">
<animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"></animate>
</circle>

<!-- arco de backup maior -->
<path d="M150 105 A50 50 0 1 1 50 105" stroke="#39d6ff" stroke-width="5" fill="none" stroke-linecap="round">

<animateTransform attributeName="transform" type="rotate" from="0 100 105" to="360 100 105" dur="5s" repeatCount="indefinite"></animateTransform>

</path>

</svg>