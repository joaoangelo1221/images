<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40">

<!-- linha instável -->
<line x1="10" y1="20" x2="390" y2="20" stroke="#ff3b3b" stroke-width="3" stroke-dasharray="8,6" opacity="0.6">

<animate attributeName="stroke-dashoffset" values="0;14" dur="0.7s" repeatCount="indefinite"></animate>

</line>

<!-- pulso de falha -->
<circle cx="10" cy="20" r="3" fill="#ff3b3b">

<animate attributeName="cx" values="10;390" dur="1.4s" repeatCount="indefinite"></animate>

<animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"></animate>

</circle>

<!-- pulso secundário -->
<circle cx="10" cy="20" r="2" fill="#ff3b3b" opacity="0.8">

<animate attributeName="cx" values="10;390" dur="1.4s" begin="0.7s" repeatCount="indefinite"></animate>

</circle>

</svg>