<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<radialGradient id="bodyGrad" cx="50%" cy="40%" r="70%">
<stop offset="0%" stop-color="#ffffff"></stop>
<stop offset="100%" stop-color="#d9d9d9"></stop>
</radialGradient>

<radialGradient id="glassGrad" cx="50%" cy="35%" r="70%">
<stop offset="0%" stop-color="#4a4a4a"></stop>
<stop offset="100%" stop-color="#0c0c0c"></stop>
</radialGradient>

<radialGradient id="lensGrad">
<stop offset="0%" stop-color="#2a2a2a"></stop>
<stop offset="100%" stop-color="#000"></stop>
</radialGradient>

</defs>

<!-- Corpo superior -->
<ellipse cx="256" cy="140" rx="170" ry="90" fill="url(#bodyGrad)"></ellipse>

<!-- aro inferior -->
<ellipse cx="256" cy="210" rx="165" ry="50" fill="#e6e6e6"></ellipse>

<!-- parafusos -->
<circle cx="140" cy="200" r="6" fill="#9a9a9a"></circle>
<circle cx="372" cy="200" r="6" fill="#9a9a9a"></circle>
<circle cx="256" cy="105" r="7" fill="#7a7a7a"></circle>

<!-- dome vidro -->
<ellipse cx="256" cy="315" rx="135" ry="120" fill="url(#glassGrad)"></ellipse>

<!-- lente -->
<circle cx="256" cy="300" r="45" fill="url(#lensGrad)"></circle>

<!-- anel da lente -->
<circle cx="256" cy="300" r="28" fill="#1b1b1b"></circle>

<!-- LEDs infravermelhos -->
<g fill="#d8d8d8">

<circle cx="256" cy="235" r="5"></circle>
<circle cx="290" cy="245" r="5"></circle>
<circle cx="310" cy="270" r="5"></circle>
<circle cx="310" cy="300" r="5"></circle>
<circle cx="290" cy="325" r="5"></circle>
<circle cx="256" cy="335" r="5"></circle>
<circle cx="222" cy="325" r="5"></circle>
<circle cx="202" cy="300" r="5"></circle>
<circle cx="202" cy="270" r="5"></circle>
<circle cx="222" cy="245" r="5"></circle>

</g>

<!-- reflexo da lente -->
<ellipse cx="240" cy="285" rx="10" ry="6" fill="#ffffff" opacity="0.35"></ellipse>

</svg>