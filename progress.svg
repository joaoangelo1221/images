<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80">

<!-- linha principal -->
<line x1="30" y1="40" x2="370" y2="40" stroke="#9a9a9a" stroke-width="30" opacity="0.45"></line>

<!-- bloco de progresso principal -->
<rect x="22" y="32" width="16" height="16" rx="4" fill="#bfbfbf">

<animate attributeName="x" values="22;362" dur="2s" repeatCount="indefinite"></animate>

</rect>

<!-- bloco secundário -->
<rect x="22" y="32" width="16" height="16" rx="4" fill="#d0d0d0" opacity="0.7">

<animate attributeName="x" values="22;362" dur="2s" begin="1s" repeatCount="indefinite"></animate>

</rect>

</svg>