<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220">

<!-- FUNDO -->
<rect width="260" height="220" fill="none"></rect>

<!-- PAREDE DE TIJOLOS -->
<g stroke="#7a0000" stroke-width="2">

<!-- fileira 1 -->
<rect x="20" y="90" width="40" height="20" fill="#ff3a2f"></rect>
<rect x="60" y="90" width="40" height="20" fill="#ff3a2f"></rect>
<rect x="100" y="90" width="40" height="20" fill="#ff3a2f"></rect>
<rect x="140" y="90" width="40" height="20" fill="#ff3a2f"></rect>
<rect x="180" y="90" width="40" height="20" fill="#ff3a2f"></rect>

<!-- fileira 2 (deslocada) -->
<rect x="40" y="110" width="40" height="20" fill="#e0281d"></rect>
<rect x="80" y="110" width="40" height="20" fill="#e0281d"></rect>
<rect x="120" y="110" width="40" height="20" fill="#e0281d"></rect>
<rect x="160" y="110" width="40" height="20" fill="#e0281d"></rect>
<rect x="200" y="110" width="40" height="20" fill="#e0281d"></rect>

<!-- fileira 3 -->
<rect x="20" y="130" width="40" height="20" fill="#ff3a2f"></rect>
<rect x="60" y="130" width="40" height="20" fill="#ff3a2f"></rect>
<rect x="100" y="130" width="40" height="20" fill="#ff3a2f"></rect>
<rect x="140" y="130" width="40" height="20" fill="#ff3a2f"></rect>
<rect x="180" y="130" width="40" height="20" fill="#ff3a2f"></rect>

<!-- fileira 4 -->
<rect x="40" y="150" width="40" height="20" fill="#e0281d"></rect>
<rect x="80" y="150" width="40" height="20" fill="#e0281d"></rect>
<rect x="120" y="150" width="40" height="20" fill="#e0281d"></rect>
<rect x="160" y="150" width="40" height="20" fill="#e0281d"></rect>
<rect x="200" y="150" width="40" height="20" fill="#e0281d"></rect>

</g>

<!-- BASE DA PAREDE -->
<rect x="20" y="90" width="220" height="80" fill="none" stroke="#5c0000" stroke-width="3"></rect>

<!-- CHAMAS -->
<g>

<!-- chama 1 -->
<path fill="#ff4500" d="M40 90 C35 70 60 65 50 40 C80 60 70 75 90 90 Z">
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="0.7s" repeatCount="indefinite"></animateTransform>
</path>

<!-- chama interna -->
<path fill="#ffd000" d="M55 90 C50 75 65 65 60 50 C75 65 70 75 80 90 Z">
<animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.6s" repeatCount="indefinite"></animateTransform>
</path>

<!-- chama 2 -->
<path fill="#ff4500" d="M100 90 C95 65 120 60 110 35 C140 55 130 70 150 90 Z">
<animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="0.8s" repeatCount="indefinite"></animateTransform>
</path>

<!-- chama interna -->
<path fill="#ffd000" d="M115 90 C110 70 125 60 120 45 C135 60 130 70 140 90 Z">
<animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.7s" repeatCount="indefinite"></animateTransform>
</path>

<!-- chama 3 -->
<path fill="#ff4500" d="M160 90 C155 65 180 65 170 40 C200 60 190 75 210 90 Z">
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="0.75s" repeatCount="indefinite"></animateTransform>
</path>

<!-- chama interna -->
<path fill="#ffd000" d="M175 90 C170 75 185 65 180 50 C195 65 190 75 200 90 Z">
<animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.65s" repeatCount="indefinite"></animateTransform>
</path>

</g>

</svg>