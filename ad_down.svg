<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260">

<!-- servidor -->
<rect x="120" y="60" width="100" height="120" rx="8" fill="#1a0202" stroke="#ff3b3b" stroke-width="3"></rect>

<!-- baias -->
<rect x="130" y="75" width="80" height="20" fill="#2b0606"></rect>
<rect x="130" y="105" width="80" height="20" fill="#2b0606"></rect>
<rect x="130" y="135" width="80" height="20" fill="#2b0606"></rect>

<!-- LEDs instáveis -->
<circle cx="200" cy="85" r="3" fill="#ff3b3b">
<animate attributeName="opacity" values="1;0.1;1" dur="0.4s" repeatCount="indefinite"></animate>
</circle>

<circle cx="200" cy="115" r="3" fill="#ff3b3b">
<animate attributeName="opacity" values="0.1;1;0.1" dur="0.5s" repeatCount="indefinite"></animate>
</circle>

<circle cx="200" cy="145" r="3" fill="#ff3b3b">
<animate attributeName="opacity" values="1;0.2;1" dur="0.35s" repeatCount="indefinite"></animate>
</circle>

<!-- nó AD instável -->
<circle cx="70" cy="120" r="10" fill="#ff3b3b">

<animate attributeName="r" values="10;15;8;14;10" dur="1.2s" repeatCount="indefinite"></animate>

</circle>

<!-- conexão quebrada -->
<line x1="80" y1="120" x2="120" y2="120" stroke="#ff3b3b" stroke-width="3" stroke-dasharray="6,4">

<animate attributeName="stroke-dashoffset" values="0;10" dur="0.6s" repeatCount="indefinite"></animate>

</line>

<!-- nós do diretório -->
<circle cx="270" cy="90" r="6" fill="#ff3b3b"></circle>
<circle cx="300" cy="120" r="6" fill="#ff3b3b"></circle>
<circle cx="270" cy="150" r="6" fill="#ff3b3b"></circle>

<!-- conexões instáveis -->
<line x1="220" y1="110" x2="270" y2="90" stroke="#ff3b3b" stroke-width="2" stroke-dasharray="4,4"></line>

<line x1="220" y1="120" x2="300" y2="120" stroke="#ff3b3b" stroke-width="2" stroke-dasharray="4,4"></line>

<line x1="220" y1="130" x2="270" y2="150" stroke="#ff3b3b" stroke-width="2" stroke-dasharray="4,4"></line>

<!-- pulso de falha -->
<circle cx="240" cy="120" r="3" fill="#ff3b3b">

<animate attributeName="cx" values="220;300;240" dur="1s" repeatCount="indefinite"></animate>

<animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"></animate>

</circle>

</svg>