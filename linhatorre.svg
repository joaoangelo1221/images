<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80">

<!-- linha base -->
<line x1="60" y1="40" x2="340" y2="40" stroke="#6f7680" stroke-width="4" stroke-linecap="round" opacity="0.5"></line>

<!-- trilho central -->
<line x1="60" y1="40" x2="340" y2="40" stroke="#cfd6dd" stroke-width="2" stroke-linecap="round" opacity="0.3"></line>

<!-- pulso de comunicação (vai e volta) -->
<circle cx="60" cy="40" r="6" fill="#e5eaf0">

<animate attributeName="cx" values="60;340;60" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"></animate>

</circle>

<!-- pulso secundário -->
<circle cx="60" cy="40" r="4" fill="#c4ccd6" opacity="0.8">

<animate attributeName="cx" values="60;340;60" dur="2.2s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"></animate>

</circle>

<!-- pulso terciário -->
<circle cx="60" cy="40" r="3" fill="#eef2f6" opacity="0.6">

<animate attributeName="cx" values="60;340;60" dur="2.2s" begin="1.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"></animate>

</circle>

</svg>