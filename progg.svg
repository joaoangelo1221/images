<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80">

<defs>

<linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#5f6670"></stop>
<stop offset="50%" stop-color="#c4ccd6"></stop>
<stop offset="100%" stop-color="#5f6670"></stop>
</linearGradient>

</defs>

<!-- linha principal -->
<line x1="20" y1="40" x2="380" y2="40" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round" opacity="0.75"></line>

<!-- trilho central discreto -->
<line x1="20" y1="40" x2="380" y2="40" stroke="#e0e6ec" stroke-width="2" opacity="0.35"></line>

<!-- esfera principal -->
<circle r="9" fill="#d5dbe3">

<animateMotion dur="2s" repeatCount="indefinite" path="M20 40 L380 40"></animateMotion>

</circle>

<!-- esfera secundária -->
<circle r="7" fill="#c4ccd6" opacity="0.85">

<animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M20 40 L380 40"></animateMotion>

</circle>

<!-- esfera terciária -->
<circle r="5" fill="#eef2f6" opacity="0.7">

<animateMotion dur="2s" begin="1.5s" repeatCount="indefinite" path="M20 40 L380 40"></animateMotion>

</circle>

</svg>