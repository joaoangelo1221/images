<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

<!-- fundo -->
<circle cx="100" cy="100" r="90" fill="#081725" stroke="#0a4e86" stroke-width="3"></circle>

<!-- torre -->
<g stroke="#cfd6dd" stroke-width="3" stroke-linecap="round">

<!-- estrutura -->
<line x1="100" y1="50" x2="70" y2="150"></line>
<line x1="100" y1="50" x2="130" y2="150"></line>
<line x1="70" y1="150" x2="130" y2="150"></line>

<!-- travessas -->
<line x1="85" y1="100" x2="115" y2="100"></line>
<line x1="78" y1="125" x2="122" y2="125"></line>
<line x1="92" y1="75" x2="108" y2="75"></line>

</g>

<!-- topo -->
<circle cx="100" cy="50" r="4" fill="#00ff7a">
<animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"></animate>
</circle>

<!-- ondas de sinal -->

<g stroke="#39d6ff" stroke-width="3" fill="none" opacity="0.8">

<!-- onda 1 -->
<path d="M100 50 m-15 0 a15 15 0 1 1 30 0 a15 15 0 1 1 -30 0">
<animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"></animate>
</path>

<!-- onda 2 -->
<path d="M100 50 m-25 0 a25 25 0 1 1 50 0 a25 25 0 1 1 -50 0">
<animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.5s" repeatCount="indefinite"></animate>
</path>

<!-- onda 3 -->
<path d="M100 50 m-35 0 a35 35 0 1 1 70 0 a35 35 0 1 1 -70 0">
<animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="1s" repeatCount="indefinite"></animate>
</path>

</g>

</svg>