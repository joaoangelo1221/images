<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">

<defs>

<radialGradient id="coreDown" cx="50%" cy="50%" r="60%">
<stop offset="0%" stop-color="#ff4d4d"></stop>
<stop offset="100%" stop-color="#7a0000"></stop>
</radialGradient>

</defs>

<!-- núcleo de falha -->

<circle cx="150" cy="150" r="55" fill="url(#coreDown)">

<animate attributeName="opacity" values="1;0.6;1" dur="1.4s" repeatCount="indefinite"></animate>

</circle>


<!-- halo crítico -->

<circle cx="150" cy="150" r="70" stroke="#ff5a5a" stroke-width="4" fill="none" opacity="0.6">

<animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.6s" repeatCount="indefinite"></animate>

</circle>


<!-- onda de erro -->

<circle cx="150" cy="150" r="60" stroke="#ff3b3b" stroke-width="3" fill="none" opacity="0.5">

<animate attributeName="r" values="60;120" dur="1.8s" repeatCount="indefinite"></animate>

<animate attributeName="opacity" values="0.5;0" dur="1.8s" repeatCount="indefinite"></animate>

</circle>


<!-- segunda onda defasada -->

<circle cx="150" cy="150" r="60" stroke="#ff3b3b" stroke-width="3" fill="none" opacity="0.5">

<animate attributeName="r" values="60;120" dur="1.8s" begin="0.9s" repeatCount="indefinite"></animate>

<animate attributeName="opacity" values="0.5;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"></animate>

</circle>

</svg>